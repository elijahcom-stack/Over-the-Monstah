name: Daily data update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD) -- leave blank for yesterday'
        required: false
      end_date:
        description: 'End date (YYYY-MM-DD) -- leave blank for yesterday'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run ingest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          ARGS=""
          if [ -n "$START_DATE" ]; then ARGS="$ARGS --start-date $START_DATE"; fi
          if [ -n "$END_DATE" ]; then ARGS="$ARGS --end-date $END_DATE"; fi
          python ingest.py $ARGS
